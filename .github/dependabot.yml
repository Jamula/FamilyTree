version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
# Any Actions update must remain pinned to a verified full-length commit SHA.
# Do not auto-merge unreviewed dependency upgrades or enable paid services.
