name: .NET 11 build and test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes for high-severity vulnerabilities
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
      - name: Install .NET 11
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'
      - name: Check SDK and framework versions
        shell: bash
        run: |
          dotnet --version
          test "$(dotnet --version | cut -d. -f1)" = "11"
          ! grep -R --include='*.csproj' '<TargetFramework>net10.0</TargetFramework>' src tests
      - name: Enforce 0.1.0 freeze until MVP
        run: python3 scripts/check-version-freeze.py
      - name: Check zero-cost GitHub workflow policy
        run: python3 scripts/verify-zero-cost.py
      - name: Restore
        run: dotnet restore FamilyTree.slnx
      - name: Build
        run: dotnet build FamilyTree.slnx --no-restore --configuration Release
      - name: Restore local tools
        run: dotnet tool restore
      - name: Domain assertions and local coverage
        run: dotnet dotnet-coverage collect "dotnet run --project tests/FamilyTree.Tests/FamilyTree.Tests.csproj --no-restore --configuration Release" --output coverage.cobertura.xml --output-format cobertura
      - name: Check coverage was generated
        run: test -s coverage.cobertura.xml
      - name: Coverage reporter parser regression tests
        run: python3 scripts/test-report-coverage.py
      - name: Per-assembly coverage reporter regression tests
        run: python3 scripts/test-report-component-coverage.py
      - name: HTTP smoke with synthetic data and fail-closed APIs
        run: bash scripts/smoke-http.sh
      - name: One-command Aspire AppHost smoke
        run: bash scripts/smoke-aspire.sh
      - name: Local fictional MCP protocol handshake
        run: python3 scripts/smoke-mcp.py
      - name: Measure and enforce M1 line coverage floor
        run: python3 scripts/report-coverage.py coverage.cobertura.xml --min-overall 90 --min-domain 90
      - name: Report coverage per architectural component
        run: python3 scripts/report-component-coverage.py coverage.cobertura.xml --min-component Domain=90
# No paid Code Quality upload or persisted artifacts: $0 cost guardrail.
# Keep any future action SHA-pinned, approved, and behind explicit spending approval.
