name: .NET 11 build and test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install .NET 11
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '11.0.x'
      - name: Check SDK and framework versions
        shell: bash
        run: |
          dotnet --version
          test "$(dotnet --version | cut -d. -f1)" = "11"
          ! grep -R --include='*.csproj' '<TargetFramework>net10.0</TargetFramework>' src tests
      - name: Check zero-cost GitHub workflow policy
        run: python3 scripts/verify-zero-cost.py
      - name: Restore
        run: dotnet restore FamilyTree.slnx
      - name: Build
        run: dotnet build FamilyTree.slnx --no-restore --configuration Release
      - name: Restore local tools
        run: dotnet tool restore
      - name: Domain assertions and local coverage
        run: dotnet dotnet-coverage collect "dotnet run --project tests/FamilyTree.Tests/FamilyTree.Tests.csproj --no-restore --configuration Release" --output coverage.cobertura.xml --output-format cobertura
      - name: Check coverage was generated
        run: test -s coverage.cobertura.xml
      - name: HTTP smoke with synthetic data and fail-closed APIs
        run: bash scripts/smoke-http.sh
# No paid Code Quality upload or persisted artifacts: $0 cost guardrail.
# Keep any future action SHA-pinned, approved, and behind explicit spending approval.
