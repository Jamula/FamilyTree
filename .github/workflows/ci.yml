name: .NET build and test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '11.0.x'
      - name: Print SDK version
        run: dotnet --version
      - name: Restore
        run: dotnet restore FamilyTree.slnx
      - name: Build
        run: dotnet build FamilyTree.slnx --no-restore --configuration Release
      - name: Restore local tools
        run: dotnet tool restore
      - name: Domain assertions and local coverage
        run: dotnet dotnet-coverage collect "dotnet run --project tests/FamilyTree.Tests/FamilyTree.Tests.csproj --no-restore --configuration Release" --output coverage.cobertura.xml --output-format cobertura
      - name: Check coverage generated
        run: test -s coverage.cobertura.xml
# Approved GitHub-owned actions pinned to immutable SHAs.
# No artifact storage or AI Code Quality upload; zero incremental service cost.
